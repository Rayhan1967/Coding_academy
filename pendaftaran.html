<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Coding Academy</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        nav { background-color: #2c3e50; padding: 15px; text-align: center; }
        nav a { color: white; text-decoration: none; padding: 10px 20px; font-weight: bold; margin: 0 5px; border-radius: 5px; }
        nav a:hover { background-color: #34495e; }
        .active { background-color: #3498db; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="number"], input[type="tel"], textarea, select { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; 
        }
        .radio-group { margin-top: 5px; }
        .radio-group input { margin-right: 5px; }
        button { background-color: #2c3e50; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #3498db; }
        
        #hasil-container { margin-top: 30px; padding: 20px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; display: none; }
        #hasil-container h3 { margin-top: 0; color: #16a085; }
        .hasil-item { margin-bottom: 8px; }
        .hasil-item strong { display: inline-block; width: 180px; }
    </style>
</head>
<body>

    <nav>
        <a href="gallery.html">Gallery Kegiatan</a>
        <a href="pendaftaran.html" class="active">Form Pendaftaran</a>
    </nav>

    <div class="container">
        <h1>Pendaftaran Coding Academy</h1>
        
        <form id="formPendaftaran">
            <div class="form-group">
                <label for="nik">NIK</label>
                <input type="number" id="nik" required placeholder="Masukkan 16 digit NIK">
            </div>
            
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
            </div>
            
            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <input type="radio" id="jk_l" name="jk" value="Laki-laki" required> <label for="jk_l" style="display:inline; font-weight:normal;">Laki-laki</label> &nbsp;&nbsp;
                    <input type="radio" id="jk_p" name="jk" value="Perempuan" required> <label for="jk_p" style="display:inline; font-weight:normal;">Perempuan</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="nohp">No. HP</label>
                <input type="tel" id="nohp" required placeholder="Contoh: 08123456789">
            </div>
            
            <div class="form-group">
                <label for="alamat">Alamat Lengkap</label>
                <textarea id="alamat" rows="3" required placeholder="Masukkan Alamat Lengkap"></textarea>
            </div>

            <div class="form-group">
                <label for="bahasa">Pilihan Bahasa Pemrograman yang Diminati</label>
                <select id="bahasa" required>
                    <option value="">-- Pilih Bahasa --</option>
                    <option value="Golang">Golang (Go)</option>
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="PHP">PHP</option>
                    <option value="Java">Java</option>
                </select>
            </div>

            <button type="submit">Simpan Pendaftaran</button>
        </form>

        <!-- Tempat menampilkan hasil pendaftaran -->
        <div id="hasil-container">
            <h3>Pendaftaran Berhasil! Berikut Data Anda:</h3>
            <div class="hasil-item"><strong>NIK:</strong> <span id="res-nik"></span></div>
            <div class="hasil-item"><strong>Nama Lengkap:</strong> <span id="res-nama"></span></div>
            <div class="hasil-item"><strong>Jenis Kelamin:</strong> <span id="res-jk"></span></div>
            <div class="hasil-item"><strong>No. HP:</strong> <span id="res-nohp"></span></div>
            <div class="hasil-item"><strong>Alamat:</strong> <span id="res-alamat"></span></div>
            <div class="hasil-item"><strong>Bahasa Peminatan:</strong> <span id="res-bahasa"></span></div>
        </div>
    </div>

    <script>
        document.getElementById('formPendaftaran').addEventListener('submit', function(event) {
            // Mencegah form melakukan refresh halaman (default behavior)
            event.preventDefault();

            // Memunculkan dialog konfirmasi sesuai permintaan tugas
            let konfirmasi = confirm("Apakah Anda sudah yakin untuk menyimpan?");
            
            if (konfirmasi) {
                // Mengambil nilai dari form
                let nik = document.getElementById('nik').value;
                let nama = document.getElementById('nama').value;
                let jk = document.querySelector('input[name="jk"]:checked').value;
                let nohp = document.getElementById('nohp').value;
                let alamat = document.getElementById('alamat').value;
                let bahasa = document.getElementById('bahasa').value;

                // Menampilkan nilai ke dalam div hasil
                document.getElementById('res-nik').innerText = nik;
                document.getElementById('res-nama').innerText = nama;
                document.getElementById('res-jk').innerText = jk;
                document.getElementById('res-nohp').innerText = nohp;
                document.getElementById('res-alamat').innerText = alamat;
                document.getElementById('res-bahasa').innerText = bahasa;

                // Memunculkan kotak hasil
                document.getElementById('hasil-container').style.display = 'block';

                // Mengosongkan form (opsional)
                document.getElementById('formPendaftaran').reset();
            }
        });
    </script>
</body>
</html>
